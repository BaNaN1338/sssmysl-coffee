name: Sync YTimes menu

on:
  # Основная синхронизация — Supabase Cron каждые 15 минут.
  # GitHub остаётся резервным запуском раз в 6 часов и для ручного запуска.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secret
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_SERVICE_ROLE_KEY is not set; skipping sync."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Call sync function
        if: steps.check.outputs.enabled == 'true'
        run: |
          curl -sS -f -X POST "https://jbsjtvpkgofiwiazqczz.supabase.co/functions/v1/sync-ytimes-menu" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{}'
